name: MovieBox Multi-Category Engine

on:
  schedule:
    - cron: '0 */6 * * *'  # প্রতি ৬ ঘণ্টা পর পর রান হবে
  workflow_dispatch:        # গিটহাব থেকে ম্যানুয়ালি রান করার অপশন

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Auto Fetch Script
        env:
          MOVIEBOX_API_BASE: ${{ secrets.MOVIEBOX_API_BASE }}
        run: python fetch_data.py

      - name: Auto Commit & Push JSON Endpoints
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/**/*.json data/*.json
          git diff-index --quiet HEAD || git commit -m "chore: update category endpoints [skip ci]"
          git push
